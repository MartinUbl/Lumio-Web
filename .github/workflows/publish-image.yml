name: Publish Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WEB_IMAGE_NAME: martinubl/lumio-web
  DISCORD_BOT_IMAGE_NAME: martinubl/lumio-discord-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest

      - name: Build and push Discord bot image
        uses: docker/build-push-action@v6
        with:
          context: ./discord_bot
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.DISCORD_BOT_IMAGE_NAME }}:latest
